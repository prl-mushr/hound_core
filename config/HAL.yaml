# HAL monitor defaults (also available under hal_monitor in SSoT.yaml).
# Recording process: bag_recorder_node. HAL publishes Bool /hal/record from RC.
diagnostics_topic: /SOC_diagnostics
startup_delay_s: 15.0
usb_reset_on_start: true
usb_reset_device: "ChibiOS/RT Virtual COM Port"

# RC → /hal/record (legacy HAL_9000 stick thresholds; 1-based channel).
record_enabled: true
record_topic: /hal/record
record_rc_topic: /hound_fcu_control/rc/in
record_rc_channel: 1
record_on_threshold: 1900
record_off_threshold: 1100

# Shared bag_recorder defaults.
# Trigger: std_msgs/Bool on /hal/record (true=start, false=stop).
# Status: latched Bool on /hal/recording.
bagdir: /root/colcon_ws/bags/
record_all_topics: true
record_topics_file: /root/colcon_ws/src/hound_core/config/rosbag_record_topics.txt
record_split_duration_min: 5

battery_voltage_threshold: 14.0
gps_min_satellites: 16
gps_max_h_acc_mm: 1000

# Control-loop rate / receive-time latency (state → cmd).
cmd_topic: /hound_nav/cmd_ackermann

fcu:
  monitor_enabled: true
  monitor_topic: /hound_fcu_control/imu
  expected_fps: 50.0
  failure_action: ""
  armed_topic: /hound_fcu_control/state/armed
  gps_satellites_topic: /hound_fcu_control/gps/satellites
  gps_h_acc_topic: /hound_fcu_control/gps/h_acc_mm
  notification_topic: /hound_fcu_control/play_tune
  control_state_topic: /hound_fcu_control/control_state

camera:
  monitor_enabled: true
  monitor_topic: /camera/infra1/image_rect_raw
  expected_fps: 60.0

vesc:
  topic: /sensors/core

elevation_map_clear:
  enabled: false
  service: /elevation_mapping/clear_map
  min_interval_s: 1.0

jetson_diagnostics:
  enabled: true
  # Leave empty to auto-detect GPU devfreq (cur_freq preferred). Override if needed.
  gpu_freq_path: ""
