# =============================================================================
# SINGLE SOURCE OF TRUTH (SSoT) for HOUND perception + control bring-up.
#
# Camera + VSLAM: composite_sensing stereo_composite (in-process IR+cuVSLAM).
# No stock realsense2_camera / isaac_ros_visual_slam path.
# =============================================================================

# In-process stereo + cuVSLAM (exclusive USB owner). Package: composite_sensing.
# IR (Track) and color use separate queues — color FPS does not gate Track.
stereo_composite:
  enabled: true
  # A/B: legacy = stereo_composite_node; modular = stereo_composite_modular_node
  architecture: modular
  camera_name: camera
  serial_number: "030422250301"
  # IR stereo drives Track (odom/TF). WxH shared with depth when enable_depth.
  infra_width: 640
  infra_height: 360
  infra_fps: 60
  emitter_enabled: 0
  # D455 (rs400) depth_module.visual_preset (set before emitter/clip):
  #   0 custom … 3 high_accuracy … 6 remove_ir_pattern
  visual_preset: 3
  clip_distance: 6.0    # meters
  enable_color: true
  color_width: 640
  color_height: 360
  color_fps: 30
  color_publish_fps: 15.0
  enable_depth: true
  # false → /camera/depth/image_rect_raw; true → aligned_depth_to_color (people mask)
  align_depth: false
  # When enable_depth: node forces depth WxH/FPS to match infra (shared module).
  depth_publish_fps: 15.0
  odom_topic: /visual_slam/tracking/odometry
  odom_frame: odom
  base_frame: camera_link
  async_sba: true
  slam_sync_mode: false
  warmup_frames: 60
  log_cuvslam_timing: false
  profile: false
  # Multi-cam batch smoke (feature/multicam-batch). When backend=dataset_replay,
  # launch starts composite_sensing multicam_rail_replay instead of RealSense.
  # Real 3× USB open is stubbed — config only for now.
  backend: realsense   # realsense | dataset_replay
  # dataset: "/root/colcon_ws/src/hound_mapping/data/rail_sim/race-2_multicam"
  cameras:
    - name: front
      role: vslam_stereo   # IR@60 + RGB + depth (hardware); replay: RGBD+IR files
      serial: "030422250301"
    - name: left
      role: rgbd
      serial: ""
    - name: right
      role: rgbd
      serial: ""

# Lidar bring-up. Prefer in-process composite (SDK + mesh PF); legacy ROS driver
# remains available when composite.enabled is false.
lidar:
  enabled: false
  backend: unitree          # unitree | ouster | livox (composite adapters)
  port: /dev/ttyUSB0
  rotate_yaw_bias: 0.0
  range_scale: 0.001
  range_bias: 0.0
  range_max: 50.0
  # Drop points closer than this in the published cloud (meters). This is what
  # RViz / topic echo see. nvblox.lidar_min_valid_range_m does NOT filter the topic.
  range_min: 0.4
  cloud_scan_num: 18
  # nvblox range-image model (must match nvblox.lidar_* below).
  # Organizer bins by azimuth×elevation and drops out-of-FoV points so nvblox's
  # checkLidarPointcloud succeeds (L1 is ~90° vertical; margin for z-bias).
  organize_cloud: true
  lidar_width: 360          # azimuth bins (even)
  lidar_height: 90          # elevation bins
  lidar_vertical_fov_rad: 2.094395   # ~120 deg
  cloud_frame: unilidar_lidar
  cloud_topic: /unilidar/cloud
  imu_frame: unilidar_imu
  imu_topic: /unilidar/imu
  # Still parsed from the serial stream; set false to skip ROS IMU publish + TF.
  enable_imu: false
  # Extrinsics: parent_frame → cloud_frame (tune to mount).
  # xyz in meters; rpy / imu_rpy in degrees (converted to rad at launch).
  publish_static_tf: true
  parent_frame: camera_link
  xyz: [0.0, 0.0, 0.1]
  rpy: [180.0, -15.0, 0.0]
  # IMU relative to lidar (only used when enable_imu + publish_static_tf).
  imu_xyz: [0.0, 0.0, 0.0]
  imu_rpy: [0.0, 0.0, 0.0]
  deskewer:
    enabled: false
    input_topic: /unilidar/cloud
    output_topic: /unilidar/cloud_deskewed
    target_frame: unilidar_lidar
    timestamp_field: time
    timestamp_unit: seconds

  # In-process Unitree SDK + constant-twist Embree mesh PF (no EKF odom prior).
  # When enabled, launch skips the legacy unitree_lidar_ros2 node.
  composite:
    enabled: false
    map_file: ""                 # path to .dae/.obj/.ply mesh
    map_frame: map
    base_frame: base_link
    pose_topic: /localization/mesh_pose
    localize_hz: 10.0
    num_particles: 2000
    beam_samples: 64
    global_init_on_start: true
    publish_cloud: true
    init_bb: {xmin: -20.0, ymin: -20.0, zmin: 0.0, xmax: 20.0, ymax: 20.0, zmax: 2.0}

# Mission bring-up (hound_core/launch/hound_core.launch.py).
launch:
  # Seconds between enabled bring-up stages (HAL → … → nvblox). Disabled stages
  # are skipped and do not consume delay.
  stage_delay_s: 5.0

ekf:
  # nav_filter EKF: MAVROS IMU + cuVSLAM pose (realsense_vslam preset).
  enabled: false
  preset: realsense_vslam

# Geometric map for navigation (ESDF / costmap).
# Geometry from depth and/or lidar; color paints the mesh. RGB+lidar (no depth) is OK.
# People mask applies to the camera/depth path only (not lidar points).
nvblox:
  enabled: false
  # backend: ros = stock nvblox_ros; hound = in-house hound_mapping
  # (TSDF integrate + GPU TSDF→BEV elev/cost/normals → LocalMap).
  backend: hound
  use_depth: true
  use_color: true
  use_lidar: true
  # Local 2.5D map (hound backend). Cost = semantic (1 - BT.601/255) OR slope lethal.
  elevation_resolution: 0.1
  unobserved_luminance: 0.0
  elev_z_min_rel: -5.0
  elev_z_max_rel: 2.0
  # Min free height under an overhang to treat the lower surface as floor.
  robot_height_m: 0.4
  # Surface tilt above this (deg from horizontal) → lethal (OR with semantic).
  lethal_slope_deg: 60.0
  # Low-res Telea fill of unknown elev (then upsample + mask). Normals/slope after.
  do_inpaint: true
  inpaint_resolution_m: 0.25
  inpaint_radius: 3
  # Unobserved cells: elev = vehicle Z until inpaint; cost from slope after.
  publish_map_rate_hz: 20.0
  # How often to drop TSDF blocks outside map_clearing_radius_m.
  map_clear_rate_hz: 20.0
  # Lidar PointCloud2 for nvblox (organized width×height required).
  # Defaults to lidar.cloud_topic; use deskewed topic if deskewer.enabled.
  lidar_topic: "/unilidar/cloud"
  # Must match lidar.lidar_width/height/vertical_fov (organizer + nvblox model).
  lidar_width: 360
  lidar_height: 90
  lidar_vertical_fov_rad: 2.094395   # ~120 deg (L1 ~90° + margin)
  # Integration-only gate (ignore near hits when updating TSDF). Does not change
  # /unilidar/cloud — set lidar.range_min to filter the published cloud.
  lidar_min_valid_range_m: 0.3
  # Max ray range into TSDF. Wired to BOTH:
  #   static_mapper.lidar_projective_integrator_max_integration_distance_m
  #   static_mapper.projective_integrator_max_integration_distance_m
  # (depth/color share the latter; keep equal so lidar-only is not stuck at 5 m).
  lidar_projective_integrator_max_integration_distance_m: 15.0
  projective_integrator_max_integration_distance_m: 15.0
  use_lidar_motion_compensation: false
  pointcloud2_timestamps_are_relative: false
  # Map resolution: 0.05 = 5 cm, 0.10 = 10 cm.
  voxel_size: 0.1
  use_people_mask: false
  # people_mask_topic: "/segmentation/refined_people_mask"
  people_mask_topic: "/segmentation/coarse_people_mask"
  # Color → semantic cost via luminance (1 - BT.601/255). Prefer grayscale
  # trav (white=free, black=obstacle). Empty = camera RGB.
  # color_topic: "/segmentation/refined_traversability"
  color_topic: "/segmentation/coarse_traversability"
  # Multi-cam: non-empty camera_names → per-view depth + color_topic_template.
  # camera_names: ["front", "left", "right"]
  # color_topic_template: "/segmentation/{name}/coarse_traversability"
  # color_info_topic_template: "/{name}/color/camera_info"
  # map_clearing_frame_id: base_link
  global_frame: odom
  map_clearing_frame_id: camera_link
  # Drop blocks farther than this from map_clearing_frame (Hz below).
  # < 0 disables. Was 7 m in yaml — looked like a hard range limit vs raw lidar.
  map_clearing_radius_m: 32.0
  # RViz mesh/layer stream: voxels farther than this from the robot are NOT
  # published (default was 5 m — looked like a hard map range). Keep ≥ integrate max.
  layer_visualization_exclusion_radius_m: 32.0
  layer_visualization_exclusion_height_m: 3.0
  # Debug back-projected lidar/depth cloud viz only (not TSDF integrate).
  max_back_projection_distance: 32.0
  # ESDF 2D slice (nvblox_ros backend only; hound BEV does not use ESDF).
  esdf_slice_height: 0.0
  esdf_slice_min_height: -0.1
  esdf_slice_max_height: 0.3
  # Rate limits (sensors can be faster; mapper throttles work).
  integrate_depth_rate_hz: 20.0
  integrate_lidar_rate_hz: 10.0
  integrate_color_rate_hz: 20.0
  update_esdf_rate_hz: 20.0   # nvblox_ros only
  update_mesh_rate_hz: 10.0
  publish_layer_rate_hz: 10.0
  # View-based decay needs a depth camera view; leave 0 for lidar-only geometry.
  decay_tsdf_rate_hz: 0.0

# Browser visualization (Viser). Separate process; subscribe-only, no control path.
# Open http://<robot-ip>:<port>/ after bring-up. Needs: pip install viser
viz:
  enabled: false
  host: "0.0.0.0"
  port: 8080
  global_frame: odom
  base_frame: base_link
  local_map_topic: /hound_mapping/local_map
  odom_topic: /visual_slam/tracking/odometry
  lidar_topic: /unilidar/cloud
  camera_topic: /camera/color/image_raw
  path_topic: /mission/path
  mesh_pose_topic: /localization/mesh_pose
  use_local_map: true
  use_odom: true
  use_lidar: true
  use_camera: true
  use_path: true
  use_mesh_pose: true
  lidar_max_points: 20000
  lidar_min_period_s: 0.2
  camera_min_period_s: 0.2
  map_mesh_stride: 2
  map_z_exaggeration: 1.0

# IGHA* (planner process) + BeamNGRL UW_mppi (main thread). Untouched deps in src/.
# Requires: pip install -e src/IGHAStar ; CUDA; LocalMap + control_state + mission path.
nav:
  enabled: false
  config_path: ""   # empty -> hound_nav/config/nav_example.yaml
  local_map_topic: /hound_mapping/local_map
  # Float64MultiArray[17] from fcu_control: pos,rpy,vel,A,G,steer,wheelspeed
  # Optional data[17]=publisher ROS time (s) for /hound_nav/state_to_cmd_ms.
  state_topic: /hound_fcu_control/control_state
  path_topic: /mission/path
  # When set + skip_planner, MPPI uses this Path and does not start IGHA*.
  inject_path_topic: /hound_nav/inject_path
  skip_planner: false
  cmd_topic: /hound_nav/cmd_ackermann
  plan_topic: /hound_nav/local_plan
  latency_topic: /hound_nav/state_to_cmd_ms
  # Wake MPPI on each control_state (min latency). If false, pace at control_rate_hz.
  event_driven: true
  # Background BEV warp+H2D at bev_hz (and on every LocalMap); MPPI uses latest ready.
  async_bev: true
  bev_hz: 20.0
  control_rate_hz: 20.0
  max_steer_rad: 0.6
  max_speed_mps: 20.0

mavros:
  # Classic multi-process MAVROS bring-up (apm.launch). Prefer fcu_control
  # for in-process MAVLink+EKF+LL. Do not enable both (they fight for the tty).
  enabled: false

  # Connection to the flight controller.
  # Form: /dev/ttyACMx:baud  (or serial:///dev/ttyACMx:baud).
  # ArduPilot USB usually enumerates as ttyACM1/ACM2 on this machine.
  # Note: libmavconn must allow baud > 65535 (patched) for 921600.
  fcu_url: "/dev/ttyACM1:921600"

  # Optional GCS bridge (e.g. "udp://@<gcs-ip>"). Leave empty to not bridge a GCS.
  gcs_url: ""

  # ROS node name of the MAVROS param plugin (target for fcu_params load).
  param_node: "/mavros/param"

  # --- MAVROS ROS-node parameters (applied to the mavros nodes) --------------
  # Authored as standard ROS 2 params-file content (node-name -> ros__parameters).
  # The launch writes this to a temp file and passes it to apm.launch. This is
  # where the GCS-bridge rate-control (our router patch) lives.
  node_params:
    mavros_router:
      ros__parameters:
        gcs_block_stream_requests: false
        gcs_throttle_hz: 0.0
        # gcs_throttle_msgids: [30, 27, 33, 32, 65, 36, 74]

  # --- ArduPilot (flight-controller) parameters ------------------------------
  # Flat name: value map written to the FCU after MAVROS connects (force-pull
  # then param load). Leave empty ({}) to not push any FCU params.
  # SR0_* rates on USB/SERIAL0 so /mavros/imu/data can reach ~200 Hz.
  fcu_params:
    SR0_EXTRA1: 200     # ATTITUDE stream (USB/SERIAL0), Hz
    SR0_RAW_SENS: 200   # RAW_IMU stream, Hz

# In-process FCU owner: libmavconn + EKF + pluggable LL (RealSense-style threads).
# When enabled, launch skips mavros / standalone ekf.
fcu_control:
  enabled: false
  # Registry key: ackermann | holonomic (see LlControllerRegistry).
  ll_controller: ackermann
  fcu_url: "/dev/ttyACM1:921600"
  # libmavconn URL: udp://[bind_host:port]@remote_host:port
  # Example: listen on all ifaces, send to GCS at 10.18.249.206:14550
  gcs_url: "udp://@10.18.249.206:14550"
  ros_publish_hz: 50.0
  # Low-rate aux thread: RC, armed, GPS sats/h_acc, mission Path (not on hot path).
  aux_publish_hz: 10.0
  gcs_block_stream_requests: true
  gcs_throttle_hz: 5.0
  gcs_throttle_msgids: [27, 30, 31, 32, 33, 65]
  send_vision_to_fcu: false
  enable_ekf: true
  enable_ll: true
  enable_baro: true
  enable_mag: true
  enable_gps: true
  # Indoor: keep false so a junk 3D fix cannot pull EKF off the hardcoded origin.
  # Set true outdoors when you want GPS position fusion into the filter.
  fuse_gps: false
  vision_odom_topic: /visual_slam/tracking/odometry
  ekf_odom_topic: ekf/odometry
  # Publish rate for ekf/odometry (IMU still runs ~200 Hz). One of: 200,100,50,25,10
  ekf_odom_hz: 50
  # Mag/baro often stream at IMU rate with stale repeats — accept at most this often.
  mag_max_hz: 20.0
  baro_max_hz: 20.0
  # How map/ext-nav is oriented at boot:
  #   gps_compass — hardcoded/GPS lat-lon origin + AHRS/mag yaw, then align VSLAM
  #   lidar_icp  — wait for PoseStamped on icp_origin_topic, then align VSLAM
  ext_nav_align: gps_compass
  icp_origin_topic: /localization/icp_origin
  ekf_cpu: 2
  ll_cpu: 3
  system_id: 255
  component_id: 191
  target_system: 1
  target_component: 1
  ext_nav_origin:
    lat: 37.8715
    lon: -122.2730
    hgt: 0.0
  # Soft-reset EKF to origin without restarting the process:
  #   ros2 topic pub --once /hound_fcu_control/ekf_reset std_msgs/msg/Empty {}
  ekf_reset_topic: ~/ekf_reset
  fcu_params:
    SR0_EXTRA1: 200
    SR0_RAW_SENS: 200
  # LL tuning for ll_controller: ackermann (schema depends on controller).
  ll:
    erpm_gain: 3166.6
    steering_max: 0.488
    wheelbase: 0.29
    cg_height: 0.125
    track_width: 0.25
    wheelspeed_max: 17.0
    nominal_voltage: 14.8
    motor_kv: 3930.0
    speed_control_kp: 1.0
    speed_control_ki: 1.0
    safe_mode: true
    accel_gain: 1.0
    roll_gain: 0.33
    steer_slack: 0.4
    LPF_tau: 0.2
    throttle_delta: 0.02
    liftoff_oversteer: true
    control_dt: 0.02

vesc:
  # Telemetry-only (no ROS motor commands; actuation goes through the FCU).
  # With fcu_control.enabled: VESC UART is polled in-process (VescRunner thread),
  # LL reads FcuBus.vesc, and /sensors/core is published at ros_publish_hz for HAL/bags.
  # Without fcu_control: standalone vesc_driver_node owns the port.
  enabled: false

  # Delay before starting standalone VESC nodes (seconds). Unused when embedded.
  start_delay_s: 0.0

  # Serial device for the VESC. Must differ from fcu_control.fcu_url / mavros.fcu_url.
  port: /dev/ttyACM0
  respawn: true
  # Poll rate for requestState (in-process or vesc_driver). 200 Hz is fine on USB.
  telemetry_hz: 200.0

  wheel_odom:
    # Feed wheel-speed measurements to mavlink (legacy vesc_to_odom.py behavior).
    enabled: false
    erpm_gain: 3166.6
    output_topic: /mavros/vision_pose/vis_odom
    min_publish_interval_s: 0.1

hal_monitor:
  # Background monitor (HAL_9000): camera health, TF, tunes, rosbag RC control,
  # battery/GPS alerts, and Jetson SOC diagnostics.
  enabled: false

  diagnostics_topic: /SOC_diagnostics
  startup_delay_s: 15.0
  # Do not USB-reset the ArduPilot (ChibiOS) port while mavros holds it open.
  usb_reset_on_start: false
  usb_reset_device: "ChibiOS/RT Virtual COM Port"

  bagdir: /root/colcon_ws/bags/
  record_topics_file: /root/colcon_ws/src/hound_core/config/rosbag_record_topics.txt
  record_split_duration_min: 5
  record_rc_channel: 3
  record_on_threshold: 1900
  record_off_threshold: 1100

  battery_voltage_threshold: 14.0
  gps_min_satellites: 16
  gps_max_h_acc_mm: 1000

  # Stock ROS msgs from hound_fcu_control (no mavros_msgs).
  fcu:
    monitor_enabled: true
    monitor_topic: /hound_fcu_control/imu
    expected_fps: 50.0
    failure_action: ""
    pose_topic: /hound_fcu_control/ap/local_odometry
    armed_topic: /hound_fcu_control/state/armed
    gps_satellites_topic: /hound_fcu_control/gps/satellites
    gps_h_acc_topic: /hound_fcu_control/gps/h_acc_mm
    notification_topic: /hound_fcu_control/play_tune
    channel_topic: /hound_fcu_control/rc/in
    base_frame: base_link

  camera:
    monitor_enabled: true
    # stereo_composite publishes color (IR stays in-process, not on DDS).
    monitor_topic: /camera/color/image_raw
    expected_fps: 15.0
    pos: [0.15, 0.047, 0.04]
    rot: [0.0, 0.0, 0.0, 1.0]
    depth_frame: camera_link
    depth_optical_frame: camera_color_optical_frame

  vesc:
    topic: /sensors/core

  elevation_map_clear:
    enabled: false
    service: /elevation_mapping/clear_map
    min_interval_s: 1.0

  jetson_diagnostics:
    enabled: true
    gpu_freq_path: ""

segmentation:
  # Master switch for the dora pipeline: clipseg_encoder -> seg_refine.
  # NanoSAM: FiLM decode ∥ SAM encode on two CUDA streams, then SAM decode.
  # When enabled, the camera's color stream is auto-enabled (runs on RGB).
  # Required for stock nvblox people masking (refined_people_mask).
  enabled: true

  # Offline-eval mode: run segmentation even when the camera is DISABLED, so it
  # consumes a color stream from elsewhere (e.g. `ros2 run hound_core bag_replay`
  # publishing /camera/color/image_raw). Leave false for live operation.
  replay_mode: false

  # HuggingFace model id. rd16 is the light/fast variant (good on Orin NX).
  model: "CIDAS/clipseg-rd16"

  # Prompt groups → CLIPSeg label map (mono8: 0=none, 1=traversable, 2=non_traversable,
  # 3=people). Empty lists skip that group at decode time. Trav rgb8 uses
  # traversability_colors below; unlabeled pixels get ``none``.
  # Nav-only: leave traversable + people empty → only non_traversable is painted;
  # everything else stays ``none`` (typically white / free for mapper cost).
  prompts:
    traversable: []
    non_traversable: ["furniture", "wall", "pillar", "people", "car"]
    people: []

  # Optional: subtract from every group before label/pack (e.g. sky false positives).
  suppress_prompts: []

  # How to combine the sub-prompt maps within a group, before the argmax label:
  #   max      -> per-group OR; SATURATES and is list-size invariant (recommended)
  #   noisy_or -> 1 - prod(1 - p) (grows with list size)
  #   mean     -> count-weighted, but dilutes a lone strong match
  #   sum      -> grows with list size (clamped)
  aggregate: "max"

  # Optional TensorRT vision tower. Empty = torch (+ compile_mode below).
  # Build: bash ../perception_models/scripts/build_clipseg_vision_engine.sh
  # Bench:  python3 ../perception_models/scripts/bench_clipseg.py --trt-engine <engine>
  clipseg_vision_engine: "/root/colcon_ws/src/perception_models/data/clipseg_vision_rd16_224.engine"

  input_res: 224          # 224 (fast) or 352 (CLIPSeg native, sharper)
  threshold: 0.3          # below this a pixel is label 0 (none/unknown)

  # Trav rgb8 colors for coarse + refined traversability topics.
  # Mapper cost ≈ 1 - BT.601(luminance)/255 — use white≈free, black≈lethal.
  # Priority when painting: non_traversable > people > traversable > none.
  traversability_colors:
    traversable: [255, 255, 255]
    non_traversable: [0, 0, 0]
    people: [0, 0, 0]
    none: [255, 255, 255]
  # Optional; defaults to threshold above.
  # traversability_pack_threshold: 0.3
  # NOTE: max-autotune's GEMM autotuning is disabled on Orin NX (too few SMs), so
  # it gives ~no gain over reduce-overhead but costs much longer startup.
  # Ignored when clipseg_vision_engine is set.
  compile_mode: "reduce-overhead"   # "reduce-overhead" | "default" | "none"

  color_topic: "/camera/color/image_raw"
  # Multi-cam batch encode: list of color topics (encoder packs N×RGB).
  # color_topics: ["/front/color/image_raw", "/left/color/image_raw", "/right/color/image_raw"]
  # camera_names: ["front", "left", "right"]
  # clipseg_batch_n: 3
  # clipseg_vision_engine: ".../clipseg_vision_rd16_224_b3.engine"
  labels_topic: "/segmentation/labels"        # mono8 category map (the product)

  # FiLM coarse trav (works with sam_node false). Same rgb8 + colors as refined.
  publish_coarse_traversability: true
  coarse_traversability_topic: "/segmentation/coarse_traversability"
  coarse_people_mask_topic: "/segmentation/coarse_people_mask"

  # Debug overlay: category colors blended on the image (toggleable). Blend
  # strength: 0 = original only, 1 = seg colors only (further weighted per-pixel
  # by confidence so background stays clear).
  viz_overlay: false
  overlay_topic: "/segmentation/overlay"
  overlay_alpha: 0.5

  # SAM box extraction / dual decode (one encode, two mask decodes):
  #   sam_min_area: ignore blobs smaller than this (frac of image)
  #   sam_max_boxes: nav budget (CLIPSeg trav/nontrav CCs)
  #   sam_max_boxes_manip: manip budget (YOLO person/object boxes); independent
  #     so people never starve traversability. Keep each <= TRT max_batch (16).
  sam_min_area: 0.002
  sam_max_boxes: 6
  sam_max_boxes_manip: 8
  # NanoSAM TensorRT engines (see dora/SEGMENTATION.md). A/B 1024: swap paths + size.
  sam_image_encoder: "/root/colcon_ws/src/perception_models/data/resnet18_image_encoder_512.engine"
  sam_mask_decoder: "/root/colcon_ws/src/perception_models/data/mobile_sam_mask_decoder_batched_512.engine"
  sam_image_size: 512

  # Per-stage timing when profile=true (adds CUDA syncs; use topic hz for A/B).
  #   clipseg_encoder: clipseg_encode, feature_xfer
  #   seg_refine: film_decode, sam_encoder, sam_decoder, stream_wall, stream_overlap
  pipeline_queue_size: 3
  use_cuda_streams: true
  profile: true
  profile_every: 30

  # --- SAM refinement (in-process on seg_refine; FiLM ∥ SAM-encode streams) -----
  # positive_groups / negative_groups / people → traversability_colors roles.
  # Empty prompt groups are ignored; people also published on *_people_mask.
  sam_node: true
  positive_groups: ["traversable"]
  negative_groups: ["non_traversable"]
  sam_traversability_topic: "/segmentation/refined_traversability"
  sam_people_mask_topic: "/segmentation/refined_people_mask"
  sam_overlay: false
  sam_overlay_topic: "/segmentation/refined_overlay"

# YOLO-World instance detector (dora). Same caching idea as CLIPSeg: stash class
# text embeddings once, run vision/detect every frame. Feeds spencer_port persons
# Instance detector (CLIPSeg-shaped: stash class text, hot path = detect).
# When enabled: CLIPSeg people prompts are stripped; NanoSAM people from YOLO
# boxes; spencer can use --vision yolo_dets on detections_topic.
# and (later) NanoSAM object boxes. Independent of segmentation: enabled.
yolo_world:
  enabled: false
  # Offline vocabulary (prompt-then-detect). person always kept for spencer_port.
  # Prefer stashed weights after: export_yolo_world.py --format pt
  # model: "/root/colcon_ws/src/perception_models/data/yolov8s-world_stashed.pt"
  model: "yolov8s-world.pt"
  classes: ["person", "chair", "door", "table", "bag"]
  ensure_person: true
  conf: 0.25
  imgsz: 640
  half: true
  device: "cuda:0"
  color_topic: "/camera/color/image_raw"
  detections_topic: "/yolo_world/detections"
  viz_overlay: false
  overlay_topic: "/yolo_world/overlay"
  # Empty: ONNX/TRT blocked (adaptive_max_pool2d). Use torch FP16.
  yolo_world_engine: ""
  profile: true
  profile_every: 30
  # Same camera gate as segmentation (or replay_mode).
  replay_mode: false

