# =============================================================================
# HOUND SSoT — active stack only.
#
#   stereo_composite  cameras + cuVSLAM
#   lidar             Livox composite (SDK + in-process deskew + TF)
#   mesh_pf           mesh particle filter (Vulkan RT / Embree, optional)
#   fcu_control       MAVLink + EKF + LL + vesc + ntrip
#   nvblox            hound_mapping LocalMap
#   segmentation      Dora CLIPSeg + NanoSAM
#   yolo_world        Dora YOLO-World
#   nav               Dora manager / planner / controller
#   viz               Viser browser
#   aruco_registration  ArUco detect + held map←odom TF (prior maps / inpaint)
#   hal_monitor       diagnostics / tunes
#   bag_recorder      Bool /hal/record → ros2 bag
#   launch            staggered bring-up delay
# =============================================================================

# In-process stereo + cuVSLAM (exclusive USB). Topics: /{camera_name}/color|depth/...
# Extrinsics: parent_frame → {camera_name}_link (xyz m, rpy deg).
# VSLAM measurement child = base_link; EKF owns odom → base_link TF.
# Do not set a side cam parent to base_link just to run VSLAM — launch
# composes the parent chain into T_base_cam for the VSLAM body mount.
#
# KNOWN LIMITATION — cuVSLAM overconfidence / glitches:
#   cuVSLAM can lose orientation on large motions yet keep tracking in a new
#   reference frame (high confidence, wrong attitude). With VSLAM as the sole
#   positioning source, glitches are hard to detect (tilt re-align helps but
#   is not a substitute for an independent pose). Prefer multi-cam VSLAM or
#   an absolute aid (GPS / mesh ICP / mocap). GPS should make disagreement
#   checks easier; mocap validation is planned when the setup is available.
#
# Update camera mounts from vlcal (uses lidar xyz/rpy below + calib.json per cam):
#   cd colcon_ws/src/hound_core/scripts/vlcal
#   ./run_vlcal.sh calibrate camera_front   # repeat left/right; see scripts/vlcal/README.md
#   ./run_vlcal.sh apply_ssot               # dry-run
#   ./run_vlcal.sh apply_ssot --write       # patch this file (backup *.bak_vlcal)
# Or: python3 apply_vlcal_to_ssot.py --calib-root colcon_ws/calib/vlcal --no-tf [--write]
# Maps: base_link→camera_front_link = stereo_composite.cameras.camera_front.xyz/rpy
#       camera_front_link→camera_{left,right}_link = cameras.camera_{left,right}.xyz/rpy
stereo_composite:
  enabled: true
  architecture: modular
  backend: realsense
  parent_frame: camera_front_link
  odom_topic: /visual_slam/tracking/odometry
  odom_frame: odom
  base_frame: base_link
  publish_odom_tf: false
  # 0 = publish every successful track. Else stride = round(infra_fps / this).
  # Tracking still runs every IR frame; only ROS odom (→ EKF) is gated.
  odom_publish_hz: 60.0
  async_sba: true
  slam_sync_mode: false
  warmup_frames: 60
  log_cuvslam_timing: false
  # Periodic [sensor_rate] color/depth Hz logs (modular composite).
  log_sensor_rates: false
  profile: false
  visual_preset: 3
  clip_distance: 3.0
  initial_reset: false
  align_depth: false
  # Published color is undistorted (pinhole, D=0) on /{name}/color/image_raw.
  # Multi-cam color phase sync (POSIX shm, no ROS): front is master; left/right
  # lock stride phase to the sensor frame nearest (front_publish_stamp + 1/pub_fps).
  color_sync_master: camera_front
  cameras:
    camera_front:
      camera_name: camera_front
      serial_number: "030422250301"
      infra_width: 640
      infra_height: 360
      infra_fps: 60
      emitter_enabled: 0
      vslam_enabled: true
      vslam_type: 2
      color_width: 640
      color_height: 360
      color_fps: 30
      depth_width: 640
      depth_height: 360
      depth_fps: 60
      color_publish_fps: 10.0
      depth_publish_fps: 10.0
      parent_frame: base_link
      xyz: [0.121473, 0.032573, 0.061030]
      rpy: [0.544, 1.518, 0.924]
      # rpy: [0.0, 0.0, 0.0]
    camera_left:
      camera_name: camera_left
      serial_number: "909512071675"
      infra_width: 640
      infra_height: 360
      infra_fps: 30
      emitter_enabled: 0
      vslam_enabled: false
      vslam_type: 0
      color_width: 640
      color_height: 360
      color_fps: 30
      depth_width: 640
      depth_height: 360
      depth_fps: 30
      color_publish_fps: 10.0
      depth_publish_fps: 10.0
      
      xyz: [-0.078877, 0.040504, 0.037762]
      rpy: [-1.787, 0.626, 135.608]
    camera_right:
      camera_name: camera_right
      serial_number: "825312070949"
      infra_width: 640
      infra_height: 360
      infra_fps: 30
      emitter_enabled: 0
      vslam_enabled: false
      vslam_type: 0
      color_width: 640
      color_height: 360
      color_fps: 30
      depth_width: 640
      depth_height: 360
      depth_fps: 30
      color_publish_fps: 10.0
      depth_publish_fps: 10.0
      xyz: [-0.057682, -0.075743, 0.137197]
      rpy: [-0.461, 1.868, -133.999]

# Livox Mid-360(S) via composite (SDK in-process). Host NIC on same subnet.
# base_link → livox_frame (xyz/rpy) is the lidar anchor for vlcal → camera mounts above.
lidar:
  enabled: true
  backend: livox
  lidar_ip: "192.168.1.138"
  local_ip: "192.168.1.50"
  local_port: 56101
  config_path: ""
  frame_time_ms: 100
  range_max: 70.0
  range_min: 0.2
  organize_cloud: true
  lidar_width: 360
  lidar_height: 96
  lidar_vertical_fov_rad: 1.0297
  lidar_elevation_below_deg: 7.0
  lidar_elevation_above_deg: 52.0
  cloud_frame: livox_frame
  cloud_topic: /livox/cloud
  imu_frame: livox_imu
  imu_topic: /livox/imu
  core_temp_topic: /livox/core_temp
  environment_temp_topic: ""
  temp_query_period_s: 2.0
  core_temp_warn_c: 55.0
  cloud_stale_warn_s: 5.0
  status_log_period_s: 60.0
  enable_imu: true
  publish_static_tf: true
  parent_frame: base_link
  # xyz: [0.0, 0.15, 0.15]
  # rpy: [178.0, -13.5, 0.0]
  xyz: [0.105645, 0.022548, 0.105696]
  rpy: [179.958, -13.248, 0.944] #-0.513] # run vlcal again.
  # Mid-360 user manual: IMU chip in lidar (point-cloud) coordinates, axes aligned.
  imu_xyz: [0.011, 0.02329, -0.04412]
  imu_rpy: [0.0, 0.0, 0.0]
  composite:
    enabled: true
    publish_cloud: true
    base_frame: base_link
    # In-process odom-polyline deskew (nvblox lidar MC forced off when this is on).
    deskew:
      enabled: true
      reference: end
      motion_frame: odom
      odom_topic: /ekf/odometry
      # odom_topic: /visual_slam/tracking/odometry
      pose_buffer_s: 1.0
      # Host receive → photon time (ms). Shifts cloud stamp (and deskew window)
      # backward so scan_end is in the past of /ekf/odometry. Must exceed EKF
      # odom age (~1 IMU period) or deskew skips with "do not cover scan interval".
      wire_latency_ms: 20.0
      publish_raw_cloud: false
      raw_cloud_topic: /livox/cloud_raw
      warn_ms: 40.0

# Embree / Vulkan-RT constant-twist mesh PF (subscribes to deskewed cloud_topic).
mesh_pf:
  enabled: false
  # Low-poly map-frame mesh from decimate_mesh.py (not the raw TSDF PLY).
  map_file: "/root/colcon_ws/maps/hound_tsdf_mesh_pf.obj"
  cloud_topic: /livox/cloud
  pose_topic: /localization/mesh_pose
  map_frame: map
  odom_frame: odom
  base_frame: base_link
  publish_tf: true   # latch map←odom on /tf_static (same as ArUco)
  localize_hz: 10.0
  num_particles: 2000
  beam_samples: 64
  global_init_on_start: true
  # auto = Vulkan rayQuery (Orin RT cores) then Embree CPU fallback
  raycast_backend: auto
  # empty → <map_file stem>.yaml sidecar (written by decimate_mesh.py)
  init_bb_file: ""
  init_bb: {}

launch:
  # Seconds between enabled bring-up stages. Disabled stages skip the delay.
  stage_delay_s: 5.0

# In-process FCU: libmavconn + EKF + LL (+ optional VESC / NTRIP).
# enabled is the master switch — nested vesc/ntrip/ll/ekf are ignored when false.
# ros2 topic pub --once /hound_fcu_control/ekf_reset std_msgs/msg/Empty
fcu_control:
  enabled: true
  ll_controller: ackermann
  fcu_url: "/dev/ttyACM0:921600"
  gcs_url: "udp://@10.18.249.206:14550"
  ros_publish_hz: 50.0
  aux_publish_hz: 10.0
  gcs_block_stream_requests: true
  gcs_throttle_hz: 5.0
  gcs_throttle_msgids: [26, 30, 31, 32, 33, 65]
  send_vision_to_fcu: false
  enable_ekf: true
  enable_ll: true
  # Height: offset = baroHgt - hgtRef at InitialiseFilter. Fuses with VSLAM Z.
  enable_baro: false
  enable_mag: true
  # Mag for AHRS heading at init; false = no continuous FuseMagnetometer.
  fuse_mag: false
  enable_gps: true
  fuse_gps: false
  vision_odom_topic: /visual_slam/tracking/odometry
  ekf_odom_topic: /ekf/odometry
  publish_ekf_tf: true
  ekf_odom_frame: odom
  ekf_base_frame: base_link
  ekf_odom_hz: 200
  mag_max_hz: 20.0
  baro_max_hz: 20.0
  # Measurement noise (not in delays_ms). Defaults match prior hardcodes.
  baro_sigma_m: 1.0         # height sigma (m) → R_hgt / BaroSigma
  mag_sigma: 0.5             # scaled-field sigma → magMeasurementSigma
  # VSLAM / ext-nav R (was hardcoded 0.1 / 0.1 / 0.2). vel unused while fuse_vel=false.
  vslam_pos_sigma_m: 0.1     # XYZ + height (m)
  vslam_yaw_sigma_rad: 0.1   # yaw (rad)
  vslam_vel_sigma_mps: 0.2   # vel (m/s); reserved
  # Inflate R_MAG when |B| leaves expected earth field (µT). 0 = off.
  # R *= (1 + gain * ((|B|/B0) - 1)^2); B0 from WMM (fallback 49 µT).
  mag_interference_gain: 1.0
  # GPS/VSLAM/ICP: stamp-gated bus write + EKF consume_fresh (no fuse rate cap).
  # Mag/baro: rate-limited fusion (no independent freshness on SCALED_IMU mag).
  # EKF fusion delays (ms): state recalled at IMUmsec - delay. Per source — tune independently.
  delays_ms:
    gps_pos: 100
    gps_vel: 100
    vslam_pos: 20 # 16 ms for image + 4 ms for vslam
    vslam_vel: 20
    vslam_yaw: 20
    # Reserved until ICP is fused as an ext-nav source (align-only today).
    icp_pos: 80
    icp_vel: 80
    icp_yaw: 80
    baro: 50
    mag: 25
  ext_nav_align: gps_compass
  # Ext-nav (VSLAM/ICP) sticky: Mahalanobis n-sigma on consecutive raw Δ
  # (pos + att). Fail / first lock → retune sticky to EKF, drop that sample.
  ext_nav_sticky_gate_nsigma: 5.0
  icp_origin_topic: /localization/icp_origin
  ekf_cpu: 2
  ll_cpu: 3
  system_id: 255
  component_id: 191
  target_system: 1
  target_component: 1
  ext_nav_origin:
    lat: 37.8715
    lon: -122.2730
    hgt: 0.0
  ekf_reset_topic: ~/ekf_reset
  ntrip:
    enabled: false
    server: ""
    user: ""
    password: ""
    mountpoint: ""
    gga: bus
    static_gga: ""
    gga_period_s: 10.0
    reconnect_s: 2.0
    rtcm_topic: ~/rtcm
  fcu_params:
    SR0_EXTRA1: 200
    SR0_RAW_SENS: 200
  # ll:
  #   # Must match nav.cmd_topic (MPPI publishes here; LL subscribes).
  #   cmd_topic: /hound_nav/cmd_ackermann
  #   erpm_gain: 3166.6
  #   steering_max: &max_steer_rad 0.388
  #   wheelbase: 0.29
  #   cg_height: 0.125
  #   track_width: 0.25
  #   wheelspeed_max: &max_speed_mps 4.0
  #   nominal_voltage: 14.8
  #   motor_kv: 3930.0
  #   kv_correction_factor: 0.69
  #   kd_alpha: 0.2
  #   speed_control_kp: 1.0
  #   speed_control_ki: 1.0
  #   safe_mode: true
  #   accel_gain: 1.0
  #   roll_gain: 0.33
  #   steer_slack: 0.4
  #   LPF_tau: 0.2
  #   throttle_delta: 0.02
  #   liftoff_oversteer: true
  #   control_dt: 0.02
  #   throttle_pwm_zero: 1500.0
  #   throttle_pwm_full: 2000.0
  ll: # for the big hound:
    cmd_topic: /hound_nav/cmd_ackermann
    erpm_gain: 2500.0
    steering_max: &max_steer_rad 0.362
    wheelbase: &wheelbase 0.552
    cg_height: &cg_height 0.228
    track_width: 0.457
    wheelspeed_max: &max_speed_mps 5.0
    nominal_voltage: 14.8
    motor_kv: 780.0
    kv_correction_factor: 0.9
    kd_alpha: 0.0001
    speed_control_kp: 1.0
    speed_control_ki: 1.0
    safe_mode: true
    accel_gain: 1.0
    roll_gain: 0.33
    steer_slack: 0.4
    LPF_tau: 0.2
    throttle_delta: 0.1
    liftoff_oversteer: true
    control_dt: 0.005
    # RC ch2: center/trim = 0 m/s, full = wheelspeed_max. Below trim is reverse
    # in semi (auto speed cap stays ≥0).
    throttle_pwm_zero: 1500.0
    throttle_pwm_full: 2000.0
  # In-process VESC UART → FcuBus; edge republishes /sensors/core.
  vesc:
    enabled: true
    port: /dev/ttyACM2
    telemetry_hz: 200.0

# hound_mapping LocalMap (TSDF → elev/cost/normals). SSoT key stays ``nvblox`` for launch.
nvblox:
  # Offline: use_sim_time + remap mapper pubs to /debug/hound_mapping/*
  bag_replay_mode: false
  bag_replay_topic_prefix: debug
  enabled: false
  # Remaining color issues (misaligned / magenta in FOV) may still be camera_info,
  # TF timing, or projective vs LiDAR TSDF surface.
  # Debug: ignore seg; paint TSDF color all-white. Unobserved stays grey
  # (unobserved_luminance) so camera FOV coverage is visible.
  debug_semantic_all_traversable: false
  use_people_mask: false
  people_mask_topic: "/segmentation/refined_people_mask"
  # Zero bottom of each depth image before TSDF integrate (lidar untouched).
  depth_ignore_bottom_fraction: 0.6

  # Per-sensor integrate settings. mapping_node applies this camera/lidar's
  # projective block immediately before that sensor's integrate.
  # Depth TSDF: depth_integrator_max_integration_distance_m
  # Color paint: color_integrator_max_integration_distance_m
  # Templates expand {name}. Launch rejects roi left+right>1 or top+bottom>1.
  cameras:
    color_template: /{name}/segmentation/refined_traversability
    info_template: /{name}/segmentation/camera_info
    depth_template: /{name}/depth/image_raw
    depth_info_template: /{name}/depth/camera_info
    camera_front:
      use_depth: true
      use_color: true
      roi: # fraction of image; 0 = no crop
        left: 0.05
        right: 0.05
        top: 0.1
        bottom: 0.6
      projective_integration_parameters:
        depth_integrator_max_integration_distance_m: 4.0
        color_integrator_max_integration_distance_m: 12.0
        truncation_distance_vox: 5.0
        max_weight: 1.0
        weighting_mode: inverse_square
        invalid_depth_decay_factor: -1.0 # <0 disables
        ray_subsampling_factor: 1
        sphere_tracer_max_ray_length_m: 12.0
        sphere_tracing_ray_subsampling_factor: 1
        sphere_tracing_measurement_weight: 0.8
    camera_left:
      use_depth: true
      use_color: true
      roi:
        left: 0.05
        right: 0.05
        top: 0.1
        bottom: 0.5
      projective_integration_parameters:
        depth_integrator_max_integration_distance_m: 2.0
        color_integrator_max_integration_distance_m: 12.0
        truncation_distance_vox: 5.0
        max_weight: 1.0
        weighting_mode: inverse_square
        invalid_depth_decay_factor: -1.0
        ray_subsampling_factor: 1
        sphere_tracer_max_ray_length_m: 12.0
        sphere_tracing_ray_subsampling_factor: 1
        sphere_tracing_measurement_weight: 0.8
    camera_right:
      use_depth: true
      use_color: true
      roi:
        left: 0.05
        right: 0.05
        top: 0.1
        bottom: 0.5
      projective_integration_parameters:
        depth_integrator_max_integration_distance_m: 2.0
        color_integrator_max_integration_distance_m: 12.0
        truncation_distance_vox: 5.0
        max_weight: 1.0
        weighting_mode: inverse_square
        invalid_depth_decay_factor: -1.0
        ray_subsampling_factor: 1
        sphere_tracer_max_ray_length_m: 12.0
        sphere_tracing_ray_subsampling_factor: 1
        sphere_tracing_measurement_weight: 0.8
  lidars:
    lidar:
      use_lidar: true
      topic: /livox/cloud
      width: 360
      height: 96
      elevation_below_deg: 7.0
      elevation_above_deg: 52.0
      min_valid_range_m: 0.3
      use_lidar_motion_compensation: false
      projective_integration_parameters:
        depth_integrator_max_integration_distance_m: 12.0
        truncation_distance_vox: 5.0
        max_weight: 1.0
        weighting_mode: constant
        invalid_depth_decay_factor: -1.0
        ray_subsampling_factor: 1

  # Frames / TSDF volume
  global_frame: odom
  base_frame: base_link
  map_clearing_frame_id: base_link
  # Local T_odom_base ring (same pattern as lidar composite deskew). No /tf lookups.
  odom_topic: /ekf/odometry
  pose_buffer_s: 1.0
  map_clearing_radius_m: 32.0
  # Drop live TSDF (new empty mapper). Prior BEV stays.
  # ros2 topic pub --once /hound_mapping/map_clear std_msgs/msg/Empty
  map_clear_topic: ~/map_clear
  voxel_size: 0.05
  # LocalMap BEV (nav Map_config aliases these)
  elevation_resolution: &local_map_res 0.05
  local_map_size_m: &local_map_size 20.0
  elev_z_min_rel: -2.0
  elev_z_max_rel: 2.0
  # BEV floor: distance <= this counts as occupied (0 = classic TSDF ≤0).
  # Keep small: large values smear elev along slanted lidar rays (false
  # floors above/below). 0.05 ≈ one voxel of free-side tolerance.
  bev_occ_tsdf_max_m: 0.025
  robot_height_m: 0.4
  # 90° ⇒ cos≈0 ⇒ slope never marks lethal (semantic-only cost for debug).
  lethal_slope_deg: 60.0
  # Cost/luminance when no floor or no color: mid-gray so known white/black
  # vs unknown are visible. Encoded in LocalMap.costmap (no separate observed).
  # 255=free, 0=lethal, this value=unobserved. Change here only (no C++ edit).
  unobserved_luminance: 252.0
  # Vertical half-band (m) below elev when sampling TSDF color. 0 = 2×voxel.
  # Cost takes the darkest (most lethal) luminance from elev-half_band up through
  # color_z_column_above_m (0 = full BEV Z span). Needed because elev is the
  # floor while person/wall paint sits higher in the same XY column.
  color_z_search_half_band_m: 0.05
  color_z_column_above_m: 0.0
  do_inpaint: true
  inpaint_resolution_m: 0.25
  inpaint_radius: 3
  # Median on elev before slope/normals (OpenCV 32F: 3 or 5). 0 = off.
  elev_median_ksize: 9
  # mapper_rate_hz locks the worker (integrate + BEV + sleep) and LocalMap.
  # Latest sensor frame is taken each tick. map_clear is radius trim.
  mapper_rate_hz: 10.0
  map_clear_rate_hz: 10.0
  # LayerCake save / prior BEV
  layer_cake_path: "/root/colcon_ws/maps/hound_tsdf.layercake"
  # save_elevation.py default out (empty → <layer_cake stem>.elev.yaml).
  elevation_map_path: ""
  # User-authored no-go overlay (empty → all free). Same XY frame as the cake.
  # 0 = lethal, 1 = free. Mapping ANDs this onto LocalMap cost on the GPU.
  # Author: python3 .../hound_mapping/scripts/author_lethal_map.py
  lethal_map_path: ""
  # Snapshot /tf_static map←odom next to the cake on save_layer_cake.
  save_map_odom_tf: true
  map_frame: map
  prior_layer_cake_path: "" # "/root/colcon_ws/maps/hound_tsdf.layercake"
  # T_odom_prior (xyz m + yaw rad). Identity if this session shares the saved odom.
  prior_xyz_yaw: [0.0, 0.0, 0.0, 0.0]
  prior_fill_enabled: true
  # Debug pubs (off — were expensive when RViz subscribed)
  publish_tsdf_color_mesh: false
  tsdf_color_mesh_rate_hz: 1.0
  # Near-surface TSDF voxels (PointCloud2 xyz+rgb from ColorLayer). Magenta =
  # geometry without color weight. Subscribe /hound_mapping/tsdf_voxels in RViz.
  publish_tsdf_voxels: true
  tsdf_voxel_rate_hz: 1.0
  tsdf_voxel_min_weight: 0.2
  tsdf_voxel_max_distance_m: 0.0   # 0 → 2×voxel_size
  tsdf_voxel_max_points: 400000
  publish_lidar_depth_image: false
  publish_lidar_tsdf_probe: false
  lidar_tsdf_probe_max_points: 4000

# ArUco locks map←odom while you record. That TF goes into the rosbag
# (/tf_static). Saving a LayerCake also writes a sidecar YAML next to the cake
# (same TF). Replay the bag as-is, or source: file to republish the sidecar
# without the detector. Marker pose in map: xyz (m) + rpy (deg). OpenCV axes:
# X right, Y up, Z out of the face. Identity = face-up on the floor (Z = map up).
# Wall, upright, facing +X (map forward): roll=0 pitch=-90 yaw=-90.
aruco_registration:
  enabled: true
  source: aruco   # aruco (record/lock) | file (replay sidecar, no detector)
  tf_file: ""     # empty → <layer_cake stem>.map_odom.yaml
  camera_name: camera_front
  image_topic: /camera_front/color/image_raw
  camera_info_topic: /camera_front/color/camera_info
  pose_topic: /aruco_registration/marker_pose
  map_odom_pose_topic: /aruco_registration/map_odom
  overlay_topic: /aruco_registration/overlay
  publish_overlay: true
  publish_detect_tf: true
  detected_frame: aruco_detected
  dictionary: DICT_4X4_1000
  marker_id: 0
  marker_size_m: 0.18
  min_side_px: 12.0
  dense_refine: all   # off | outer | internal | all
  dense_refine_optimize: both   # h | pose | both
  dense_refine_draw: true
  corner_refine: apriltag   # apriltag | subpix | none
  corner_refine_win_size: 10
  corner_refine_max_iter: 30
  corner_refine_min_accuracy: 0.1
  map_frame: map
  odom_frame: odom
  marker_frame: aruco_marker
  marker_xyz: [0.0, 0.0, 0.0]
  marker_rpy: [90.0, 0.0, 0.0]  # wall, upright, Z out along +X
  tf_publish_hz: 10.0
  tf_timeout_s: 0.15
  trigger_topic: /aruco_registration/trigger
  trigger_timeout_s: 8.0  # hunt window; each trigger re-reads this SSoT file
  ema_alpha: 0.25         # map←odom EMA (1 = last sample only)
  lock_once: false

viz:
  enabled: false   # prefer RViz LocalMap display (hound_rviz_plugins)
  host: "0.0.0.0"
  port: 8080
  global_frame: odom
  base_frame: base_link
  local_map_topic: /hound_mapping/local_map
  odom_topic: /ekf/odometry  # EKF off in this bring-up; use VSLAM
  lidar_topic: /livox/cloud
  camera_topic: /camera_front/color/image_raw
  path_topic: /hound_fcu_control/mission/path
  mesh_pose_topic: /localization/mesh_pose
  use_local_map: true
  use_odom: true
  use_lidar: true
  use_camera: true
  use_path: true
  use_mesh_pose: false   # mesh_pf off
  lidar_max_points: 20000
  lidar_min_period_s: 0.2
  camera_min_period_s: 0.2
  map_min_period_s: 1.0   # Viser mesh push only; mapper publish rate unchanged
  map_mesh_stride: 1
  map_z_exaggeration: 1.0

# Dora manager / planner / controller (IGHA* + MPPI).
# Full stack lives here (SSoT). Live BEV size/res come from LocalMap, not Map_config.
# Debug without the rest of hound_core:
#   ros2 launch hound_core hound_nav.launch.py
# Set enabled: false here if core launch is also running (avoids two Dora graphs).
nav:
  enabled: false
  local_map_topic: /hound_mapping/local_map
  state_topic: /hound_fcu_control/control_state
  path_topic: /hound_fcu_control/mission/path
  # RViz / other Path sources. GPS missions: mission_manager publishes goal_topic only.
  goal_topic: /goal_pose
  cmd_topic: /hound_nav/cmd_ackermann
  plan_topic: /hound_nav/local_plan
  # Timed poses + green/blue arrows (fwd/back). Bag this to replay planner viz.
  plan_markers_topic: /hound_nav/local_plan_arrows
  planner_hz: 4.0
  control_rate_hz: 25.0
  cruise_speed_mps: 3.0  # IGHA* goal speed when not stopping
  control_state_dims: 17
  track_ref_metric: screw  # screw | xy
  screw_length_m: 1.0
  lookahead: 8.0
  wp_radius: 1.0
  # FCU GPS waypoints → single /goal_pose (nav manager still also accepts Path).
  mission_manager:
    enabled: true
    mode: gps  # gps | rviz (rviz not implemented)
    gps_topic: /hound_fcu_control/gps/fix
    gps_fix_type_topic: /hound_fcu_control/gps/fix_type
    imu_topic: /hound_fcu_control/imu
    gps_waypoints_topic: /hound_fcu_control/mission/gps
    goal_topic: /goal_pose
    path_viz_topic: /hound_nav/mission/waypoints  # nav_msgs/Path for RViz
    state_topic: /hound_fcu_control/control_state
    frame_id: odom
    min_fix_type: 3
    max_h_acc_m: 2.5
    update_wp_local_from_gps: false
    publish_hz: 0.25  # also publishes immediately on waypoint reach / mission accept
  # OpenCV planner debug window (manager thread). Off for field (CPU/DISPLAY).
  planner_cv_viz: true
  planner_cv_viz_window: hound_planner_vis
  planner_cv_viz_size: 320

  MPPI_config:
    ROLLOUTS: 1024
    TIMESTEPS: 16
    BINS: 1
    u_per_command: 1
    n_iter: 1

  # Fixed BEV extent/res (aliases nvblox LocalMap). MPPI reads these at construct.
  Map_config:
    map_size: *local_map_size
    map_res: *local_map_res

  # Plant model. Controls are physical (steer rad, wheelspeed m/s); scales = 1.
  Dynamics_config:
    wheelbase: *wheelbase
    throttle_to_wheelspeed: 1.0
    steering_max: 1.0
    dt: 0.05
    D: 0.8
    B: 6.8
    C: 1.5
    lf: 0.28
    lr: 0.28
    Iz: 0.10
    LPF_tau: 0.5
    LPF_st: 0.5
    LPF_th: 0.5
    res_coeff: 0.01
    drag_coeff: 0.005
    car_length: &car_length 0.90
    car_width: &car_width 0.55
    cg_height: *cg_height
    type: "slip3d"

  # Sample steer [rad] and wheelspeed [m/s]; limits from fcu_control.ll anchors.
  Sampling_config:
    control_dim: 2
    noise_0: 0.2
    noise_1: 1.0
    scaled_dt: 0.1
    temperature: 0.1
    max_spd: *max_speed_mps
    min_spd: 0.0
    steer_lim: *max_steer_rad

  Cost_config:
    pos_w: 1.0
    speed_w: 0.0
    heading_w: 0.1
    scaling_factor: 1.0
    critical_RI: 0.5
    critical_vert_acc: 5.0
    roll_ditch_w: 50.0
    lethal_w: 50.0
    car_bb_length: 0.84
    car_bb_width: 0.52
    throttle_threshold: 0.0

  Planner_config:
    unstuck_expansions: 2000
    experiment_info_default:
      resolution: 0.5
      epsilon: &epsilon [0.25, 0.25, 0.3925, 0.25]
      backward_epsilon: *epsilon
      LCR: *epsilon
      tolerance: 0.125
      max_level: 6
      division_factor: 2
      max_expansions: 1250
      hysteresis: 100
      bidirectional: true
      # Optional GPU batching of successor expansions (IGHA*).
      # near_meet_config:
      #   enabled: true
      #   num_interpolation_points: 5
      #   num_perturbations: 3
      preemptive_expansion:
        enabled: true
        min_preemptive: 50
        max_preemptive: 100
      node_info:
        node_type: "kinodynamic"
        length: *car_length # the bounding box and wheel positions should be separable. for off-road cars, wheels are usually at the corners of the bounding box.
        width: *car_width
        map_res: *local_map_res  # overwritten from LocalMap on first pdef
        dt: 0.05
        timesteps: 5
        step_size: 1.0
        steering_list: [-15.0, -5.0, 0.0, 5.0, 15.0]
        throttle_list: [-4.0, 0, 4.0]
        del_theta: 90.0
        del_vel: 1.0
        RI: 0.7
        max_vert_acc: 8.0
        min_vel: 0.0
        max_vel: 5.0
        max_theta: 40.0
        gear_switch_time: 5.0
        hash_theta: false

  # lookahead / wp_radius are set above (do not redeclare as lists — YAML last-key wins).

hal_monitor:
  enabled: true
  diagnostics_topic: /SOC_diagnostics
  startup_delay_s: 15.0
  usb_reset_on_start: false
  usb_reset_device: "ChibiOS/RT Virtual COM Port"
  battery_voltage_threshold: 14.0
  gps_min_satellites: 16
  gps_max_h_acc_mm: 1000
  cmd_topic: /hound_nav/cmd_ackermann
  # RC → Bool /hal/record (bag_recorder). 1-based channel index.
  # CH1=steer CH3=throttle CH5=mode on the ackermann radio. Use a 2-pos
  # switch here (not throttle) — first RC sample is logged as ch=[...].
  record_enabled: true
  record_topic: /hal/record
  record_rc_topic: /hound_fcu_control/rc/in
  record_rc_channel: 4
  record_on_threshold: 1700
  record_off_threshold: 1300
  fcu:
    monitor_enabled: true
    monitor_topic: /hound_fcu_control/imu
    expected_fps: 50.0
    failure_action: ""
    armed_topic: /hound_fcu_control/state/armed
    gps_satellites_topic: /hound_fcu_control/gps/satellites
    gps_h_acc_topic: /hound_fcu_control/gps/h_acc_mm
    notification_topic: /hound_fcu_control/play_tune
    control_state_topic: /hound_fcu_control/control_state
  camera:
    monitor_enabled: true
    monitor_topic: /camera_front/color/image_raw
    expected_fps: 10.0
  vesc:
    topic: /sensors/core
  jetson_diagnostics:
    enabled: true
    gpu_freq_path: ""

# Bool /hal/record → ros2 bag record (latched status on /hal/recording).
# HAL RC (or any Bool publisher) starts/stops; record_all_topics records -a.
bag_recorder:
  enabled: true
  record_topic: /hal/record
  recording_status_topic: /hal/recording
  bagdir: /root/colcon_ws/bags/
  record_all_topics: true
  # Used only when record_all_topics is false (prune list later).
  record_topics_file: /root/colcon_ws/src/hound_core/config/rosbag_record_topics.txt
  record_split_duration_min: 5
  notification_topic: /hound_fcu_control/play_tune

# Dora CLIPSeg → NanoSAM refine.
segmentation:
  enabled: false
  replay_mode: false
  model: "CIDAS/clipseg-rd16"
  prompts:
    traversable: ["floor", "ground", "path", "dirt"]
    non_traversable: ["furniture", "wall", "pillar", "car"]
    people: ["people"]
  suppress_prompts: []
  aggregate: "max"
  clipseg_vision_engine: "/root/colcon_ws/src/perception_models/data/clipseg_vision_rd16_224_b3.engine"
  clipseg_film_engine: "/root/colcon_ws/src/perception_models/data/clipseg_film_rd16_224_b3_p9.engine"
  input_res: 224
  threshold: 0.3
  traversability_colors:
    traversable: [255, 255, 255]
    non_traversable: [0, 0, 0]
    people: [0, 0, 0]
    none: [0, 0, 0]
  compile_mode: "reduce-overhead"
  color_topic: "/camera_front/color/image_raw"
  color_topics:
    - "/camera_front/color/image_raw"
    - "/camera_left/color/image_raw"
    - "/camera_right/color/image_raw"
  camera_names: ["camera_front", "camera_left", "camera_right"]
  clipseg_batch_n: 3
  # Multi-cam without HW genlock: latest-frame (not ApproxSync on now() stamps).
  rgb_sync_mode: latest   # latest | approx
  # Only used when rgb_sync_mode=approx (live 3-cam now() spans often ~50–80 ms).
  rgb_sync_slop_s: 0.10
  # Quiet Dora rate / e2e spam while debugging mapper.
  rgb_sync_diag: false
  e2e_log: false
  labels_topic: "/segmentation/labels"
  publish_coarse_traversability: false
  coarse_traversability_topic: "/segmentation/coarse_traversability"
  coarse_people_mask_topic: "/segmentation/coarse_people_mask"
  viz_overlay: false
  overlay_topic: "/segmentation/overlay"
  overlay_alpha: 0.5
  sam_min_area: 0.002
  sam_max_boxes: 6
  sam_max_boxes_manip: 8
  sam_image_encoder: "/root/colcon_ws/src/perception_models/data/resnet18_image_encoder_512_dyn.engine"
  sam_mask_decoder: "/root/colcon_ws/src/perception_models/data/mobile_sam_mask_decoder_batched_512.engine"
  sam_image_size: 512
  pipeline_queue_size: 3
  use_cuda_streams: true
  profile: false
  profile_every: 30
  sam_node: true
  positive_groups: ["traversable"]
  negative_groups: ["non_traversable"]
  sam_traversability_topic: "/segmentation/refined_traversability"
  sam_people_mask_topic: "/segmentation/refined_people_mask"
  sam_overlay: false
  sam_overlay_topic: "/segmentation/refined_overlay"

# Dora YOLO-World (when on: CLIPSeg people prompts stripped; SAM people from YOLO).
yolo_world:
  enabled: false
  model: "yolov8s-world.pt"
  classes: ["person", "chair", "door", "table", "bag"]
  ensure_person: true
  conf: 0.25
  imgsz: 640
  half: true
  device: "cuda:0"
  color_topic: "/camera_front/color/image_raw"
  viz_overlay: false
  overlay_topic: "/yolo_world/overlay"
  yolo_world_engine: ""
  profile: false
  profile_every: 30
  replay_mode: false
