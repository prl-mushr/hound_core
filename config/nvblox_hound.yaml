# nvblox for HOUND:
#   Geometry: depth and/or lidar. Color paints the mesh (camera RGB or SAM).
#   People mask applies to the depth path only.
#   SSoT overrides use_depth / use_lidar / use_color (RGB+lidar without depth is supported).
#
# Remappings are applied in launch (hound topics ≠ Isaac /camera0/... layout).

/**:
  ros__parameters:
    cuda_stream_type: 1
    voxel_size: 0.05
    num_cameras: 1
    use_tf_transforms: true
    mapping_type: "static_tsdf"
    use_segmentation: false
    use_depth: false
    use_color: true
    use_lidar: true

    # Lidar model (overridden from SSoT). Must match organizer + pass FoV check.
    lidar_width: 360
    lidar_height: 90
    lidar_vertical_fov_rad: 2.094395
    lidar_min_valid_range_m: 0.1
    use_non_equal_vertical_fov_lidar_params: false
    use_lidar_motion_compensation: true
    pointcloud2_timestamps_are_relative: false
    integrate_lidar_rate_hz: 10.0

    tick_period_ms: 10
    integrate_depth_rate_hz: 20.0
    integrate_color_rate_hz: 5.0
    update_mesh_rate_hz: 5.0
    update_esdf_rate_hz: 10.0
    publish_layer_rate_hz: 5.0
    decay_tsdf_rate_hz: 5.0
    decay_dynamic_occupancy_rate_hz: 10.0
    clear_map_outside_radius_rate_hz: 1.0

    esdf_mode: "2d"
    publish_esdf_distance_slice: true

    maximum_input_queue_length: 10
    map_clearing_radius_m: 25.0  # overridden from SSoT; < 0 disables
    # Must exist in TF (cuVSLAM odom→camera_link or robot base).
    map_clearing_frame_id: "camera_link"
    global_frame: "odom"

    # Published mesh/layers only — does NOT limit TSDF integration (defaults were 5 m).
    layer_visualization_exclusion_radius_m: 25.0
    layer_visualization_exclusion_height_m: 3.0
    max_back_projection_distance: 25.0

    input_qos: "SENSOR_DATA"

    esdf_slice_bounds_visualization_attachment_frame_id: "camera_link"
    esdf_slice_bounds_visualization_side_length: 10.0

    multi_mapper:
      connected_mask_component_size_threshold: 2000
      remove_small_connected_components: true

    static_mapper:
      do_depth_preprocessing: false
      # Depth/color projective max. Also raise when lidar-only — some builds
      # effectively share caps; keep in sync with lidar_* below.
      projective_integrator_max_integration_distance_m: 15.0
      lidar_projective_integrator_max_integration_distance_m: 15.0
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_max_weight: 5.0
      # Full weight on/in front of surface; linear taper behind within truncation band.
      projective_integrator_weighting_mode: "constant_dropoff"
      esdf_integrator_min_weight: 0.1
      esdf_integrator_max_distance_m: 2.0
      # Tune to camera mount height (meters in map_clearing / camera frame).
      esdf_slice_height: 0.0
      esdf_slice_min_height: -0.1
      esdf_slice_max_height: 0.3

    dynamic_mapper:
      projective_integrator_max_integration_distance_m: 15.0
      lidar_projective_integrator_max_integration_distance_m: 15.0
      free_region_occupancy_probability: 0.3
      occupied_region_occupancy_probability: 0.9
      unobserved_region_occupancy_probability: 0.35
      occupied_region_half_width_m: 0.2
      esdf_integrator_min_weight: 2.0
      esdf_integrator_max_distance_m: 2.0
      free_region_decay_probability: 0.55
      occupied_region_decay_probability: 0.30
      esdf_slice_height: 0.0
      esdf_slice_min_height: -0.1
      esdf_slice_max_height: 0.3
